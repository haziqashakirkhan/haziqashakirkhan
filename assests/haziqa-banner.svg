<svg width="1472" height="828" viewBox="0 0 1472 828" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0509"/>
      <stop offset="100%" stop-color="#050205"/>
    </linearGradient>
    <linearGradient id="pinkStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5fb0"/>
      <stop offset="100%" stop-color="#ff2f92"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1472" height="828" fill="url(#bg)"/>

  <!-- ambient magenta glow behind the screen -->
  <ellipse cx="740" cy="330" rx="420" ry="260" fill="#ff2f92" opacity="0.10" filter="url(#glow)"/>

  <!-- laptop screen frame -->
  <rect x="430" y="140" width="620" height="430" rx="10" fill="#140810" stroke="url(#pinkStroke)" stroke-width="4"/>

  <!-- scanlines inside screen -->
  <g stroke="#ff2f92" stroke-width="1" opacity="0.08">
    <line x1="440" y1="170" x2="1040" y2="170"/>
    <line x1="440" y1="200" x2="1040" y2="200"/>
    <line x1="440" y1="230" x2="1040" y2="230"/>
    <line x1="440" y1="440" x2="1040" y2="440"/>
    <line x1="440" y1="470" x2="1040" y2="470"/>
    <line x1="440" y1="500" x2="1040" y2="500"/>
    <line x1="440" y1="530" x2="1040" y2="530"/>
  </g>

  <!-- glitch pixel confetti, top-left cluster -->
  <g>
    <rect x="462" y="172" width="10" height="8" fill="#ff2f92"/>
    <rect x="476" y="172" width="8" height="8" fill="#ffd6ec"/>
    <rect x="462" y="184" width="8" height="8" fill="#d6247f"/>
    <rect x="490" y="180" width="10" height="8" fill="#ffffff" opacity="0.85"/>
    <rect x="504" y="172" width="8" height="8" fill="#e7b8ff"/>
    <rect x="462" y="196" width="14" height="6" fill="#ff2f92" opacity="0.7"/>
    <rect x="520" y="188" width="8" height="8" fill="#ff5fb0"/>
    <rect x="536" y="176" width="10" height="8" fill="#ffd6ec" opacity="0.8"/>
  </g>

  <!-- glitch pixel confetti, right cluster -->
  <g>
    <rect x="900" y="220" width="10" height="8" fill="#ff2f92"/>
    <rect x="916" y="228" width="8" height="8" fill="#e7b8ff"/>
    <rect x="900" y="240" width="8" height="8" fill="#ffffff" opacity="0.8"/>
    <rect x="932" y="222" width="8" height="8" fill="#d6247f"/>
    <rect x="900" y="256" width="14" height="6" fill="#ff5fb0" opacity="0.7"/>
    <rect x="918" y="256" width="8" height="8" fill="#ffd6ec"/>
    <rect x="946" y="238" width="10" height="8" fill="#ff2f92" opacity="0.8"/>
    <rect x="900" y="380" width="10" height="8" fill="#ff2f92"/>
    <rect x="916" y="388" width="8" height="8" fill="#ffd6ec"/>
    <rect x="900" y="400" width="8" height="8" fill="#e7b8ff" opacity="0.8"/>
  </g>

  <!-- Hello World text, with chromatic glitch offset copies -->
  <g font-family="'Courier New', Consolas, monospace" font-weight="700">
    <text x="742" y="336" font-size="56" fill="#ffd6ec" opacity="0.55" text-anchor="middle" transform="translate(3,-3)">Hello</text>
    <text x="738" y="332" font-size="56" fill="#ff2f92" text-anchor="middle">Hello</text>

    <text x="746" y="412" font-size="56" fill="#ff5fb0" opacity="0.5" text-anchor="middle" transform="translate(-3,3)">World!</text>
    <text x="742" y="408" font-size="56" fill="#ffffff" text-anchor="middle">World!</text>
  </g>

  <!-- small bracket glitch accents -->
  <g stroke="#ff2f92" stroke-width="2" fill="none" opacity="0.7">
    <path d="M690 300 l-10 0 l0 12"/>
    <path d="M800 300 l10 0 l0 12"/>
  </g>

  <!-- laptop base / keyboard, flaring wider than the screen -->
  <path d="M380 570 L1100 570 L1160 660 L320 660 Z" fill="#0f070c" stroke="url(#pinkStroke)" stroke-width="4"/>
  <g stroke="#ff2f92" stroke-width="1.5" opacity="0.5">
    <line x1="400" y1="595" x2="392" y2="638"/>
    <line x1="440" y1="595" x2="434" y2="638"/>
    <line x1="480" y1="595" x2="476" y2="638"/>
    <line x1="520" y1="595" x2="518" y2="638"/>
    <line x1="560" y1="595" x2="560" y2="638"/>
    <line x1="600" y1="595" x2="602" y2="638"/>
    <line x1="640" y1="595" x2="644" y2="638"/>
    <line x1="680" y1="595" x2="686" y2="638"/>
    <line x1="720" y1="595" x2="728" y2="638"/>
    <line x1="760" y1="595" x2="770" y2="638"/>
    <line x1="800" y1="595" x2="812" y2="638"/>
    <line x1="840" y1="595" x2="854" y2="638"/>
    <line x1="880" y1="595" x2="896" y2="638"/>
    <line x1="920" y1="595" x2="938" y2="638"/>
    <line x1="960" y1="595" x2="980" y2="638"/>
    <line x1="1000" y1="595" x2="1022" y2="638"/>
    <line x1="1040" y1="595" x2="1064" y2="638"/>
    <line x1="1080" y1="595" x2="1106" y2="638"/>
  </g>

  <!-- headphones, bottom-left, overlapping the laptop corner -->
  <g>
    <path d="M200 560 C 200 470, 270 410, 350 410 C 430 410, 500 470, 500 560"
          fill="none" stroke="url(#pinkStroke)" stroke-width="10" stroke-linecap="round"/>
    <rect x="170" y="545" width="70" height="100" rx="24" fill="#0f070c" stroke="url(#pinkStroke)" stroke-width="4"/>
    <circle cx="205" cy="595" r="14" fill="#ff2f92" opacity="0.85"/>
    <rect x="470" y="545" width="70" height="100" rx="24" fill="#0f070c" stroke="url(#pinkStroke)" stroke-width="4"/>
    <circle cx="505" cy="595" r="14" fill="#ff2f92" opacity="0.85"/>
  </g>

  <!-- mouse, bottom-right -->
  <g>
    <rect x="1200" y="590" width="120" height="170" rx="55" fill="#0f070c" stroke="url(#pinkStroke)" stroke-width="4"/>
    <line x1="1260" y1="600" x2="1260" y2="660" stroke="#ff2f92" stroke-width="2" opacity="0.6"/>
  </g>
</svg> 
